name: Release

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    uses: chenasraf/workflows/.github/workflows/go-release.yml@go-release-latest
    with:
      name: backend
      go-version: '1.25'
      package: cmd/backend
      working-directory: backend
      platforms: '["linux/amd64", "linux/arm64"]'
      release-type: node
